name: Release

# Gated release: pushing a v* tag runs the offline test suite first; the
# container is built and pushed ONLY if the tests pass. The gate needs no
# provider API key: plain `uv run pytest` skips the `eval` and
# `benchmark` markers via pyproject `addopts`. The LLM evals stay in
# evals.yml (manual dispatch, and the beta release gate).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Gate: the offline test suite (no secrets, no `production` environment).
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --extra serve --extra bedrock

      - name: Run tests
        run: uv run pytest

  build-and-push:
    needs: tests # ← only builds/pushes if the test gate is green
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Audit build inputs
        run: |
          python3 scripts/audit_public_image.py --source .
          docker build --target build-context --output type=local,dest=/tmp/public-context .
          python3 scripts/audit_public_image.py --context /tmp/public-context

      - name: Build candidate locally
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Audit every candidate layer before pushing the same image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          first_tag=$(printf '%s\n' "$IMAGE_TAGS" | head -n 1)
          docker save "$first_tag" -o /tmp/candidate.tar
          python3 scripts/audit_public_image.py --image /tmp/candidate.tar
          while IFS= read -r tag; do
            test -z "$tag" || docker push "$tag"
          done <<< "$IMAGE_TAGS"
