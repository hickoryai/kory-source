name: Release

# This workflow never builds. It only publishes the tar retained by a successful
# main-only Release preflight after a maintainer has approved this exact version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version approved for release (for example v1.2.3)
        required: true
        type: string
      preflight_run_id:
        description: Successful Release preflight run ID for this exact main SHA
        required: true
        type: string
      approval:
        description: Enter the exact approved version; the protected release environment records approval
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  approval-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require an existing protected release environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          gh api "repos/${GITHUB_REPOSITORY}/environments/release" > /tmp/release-environment.json
          python3 -c 'import json; p=json.load(open("/tmp/release-environment.json")); assert any(r.get("type")=="required_reviewers" and r.get("reviewers") for r in p.get("protection_rules",[])), "release environment must require maintainer review"'

  publish:
    needs: approval-gate
    # Configure required maintainers on this environment in repository settings.
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      packages: write
    steps:
      - name: Refuse anything but a main dispatch and version-specific approval
        env:
          APPROVAL: ${{ inputs.approval }}
          VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$APPROVAL" = "$VERSION"

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Fetch the immutable preflight record
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.preflight_run_id }}
        run: gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" > /tmp/preflight-run.json

      - name: Download the retained candidate without rebuilding it
        uses: actions/download-artifact@v8
        with:
          name: release-candidate-${{ inputs.preflight_run_id }}
          path: /tmp/release-candidate
          repository: ${{ github.repository }}
          run-id: ${{ inputs.preflight_run_id }}
          github-token: ${{ github.token }}

      - name: Validate candidate, preflight identity, current main, and release tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          tag="refs/tags/${VERSION}"
          existing_tag=$(git ls-remote --tags origin "$tag")
          python3 scripts/release_candidate.py validate \
            --candidate /tmp/release-candidate/candidate.json \
            --archive /tmp/release-candidate/candidate.tar \
            --run-json /tmp/preflight-run.json \
            --repository "$GITHUB_REPOSITORY" --version "$VERSION" --source-sha "$source_sha" \
            --existing-tag "$existing_tag"

      - name: Recheck package history immediately before publication
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ github.event.repository.name }}
        run: python3 -I scripts/audit_registry_history.py --owner "$OWNER" --package "$PACKAGE"

      - name: Load and push the reviewed image only
        env:
          VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          docker load --input /tmp/release-candidate/candidate.tar
          image_id=$(python3 -c 'import json; print(json.load(open("/tmp/release-candidate/candidate.json"))["image_id"])')
          version=${VERSION#v}
          printf '%s' "$GITHUB_TOKEN" | docker login "$REGISTRY" --username "$GITHUB_ACTOR" --password-stdin
          docker tag "$image_id" "$REGISTRY/$IMAGE_NAME:$version"
          docker tag "$image_id" "$REGISTRY/$IMAGE_NAME:${version%.*}"
          docker push "$REGISTRY/$IMAGE_NAME:$version"
          docker push "$REGISTRY/$IMAGE_NAME:${version%.*}"

      - name: Push the release tag after the reviewed image
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "refs/tags/$VERSION"
