name: Release (beta)

# Same gated flow as Release, but for prerelease tags (v1.2.3-beta1, -beta2, …).
# Evals run first; the beta container ships only if they pass. Beta images are
# tagged with the full prerelease version and never get the `latest` tag.
on:
  push:
    tags: ["v*-beta*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  evals:
    uses: ./.github/workflows/evals.yml
    secrets: inherit

  build-and-push:
    needs: evals # ← only builds/pushes if the eval gate is green
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}

      - name: Audit build inputs
        run: |
          python3 scripts/audit_public_image.py --source .
          docker build --target build-context --output type=local,dest=/tmp/public-context .
          python3 scripts/audit_public_image.py --context /tmp/public-context

      - name: Build candidate locally
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Audit every candidate layer before pushing the same image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          first_tag=$(printf '%s\n' "$IMAGE_TAGS" | head -n 1)
          docker save "$first_tag" -o /tmp/candidate.tar
          python3 scripts/audit_public_image.py --image /tmp/candidate.tar
          while IFS= read -r tag; do
            test -z "$tag" || docker push "$tag"
          done <<< "$IMAGE_TAGS"
